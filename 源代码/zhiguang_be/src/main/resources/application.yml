server:
  port: 8080

spring:
  application:
    name: zhihuang
  datasource:
    url: jdbc:mysql://localhost:3306/zg_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: your_password  # 请修改为你的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2s

  # Spring Security OAuth2 Resource Server 配置（JWT RS256 验签）
  security:
    oauth2:
      resource-server:
        jwt:
          public-key-location: classpath:keys/public.pem

# 日志配置
logging:
  level:
    root: INFO
    com.tongji: DEBUG
    org.springframework.security: DEBUG

# 对象存储 OSS 配置（阿里云）
oss:
  endpoint: oss-cn-hangzhou.aliyuncs.com  # 根据你的 bucket 区域修改
  access-key-id: YOUR_ACCESS_KEY_ID       # 替换为你的 AccessKey ID
  access-key-secret: YOUR_ACCESS_KEY_SECRET  # 替换为你的 AccessKey Secret
  bucket: your-bucket-name                   # 替换为你的 bucket 名称
  folder: avatars                            # 头像存储文件夹
  public-domain: https://your-custom-domain.com  # 可选：自定义域名，不留空则使用 OSS 默认域名

# DeepSeek AI 配置
deepseek:
  api-key: YOUR_DEEPSEEK_API_KEY  # 替换为你的 DeepSeek API key
  base-url: https://api.deepseek.com
  model: deepseek-chat

# Elasticsearch 配置
elasticsearch:
  uri: http://localhost:9200
  vector-index: zhihuang_vectors

# Knife4j 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 知光接口文档
    version: v1.0
    group:
      default:
        api-rule: all
